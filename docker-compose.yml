services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aletheia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aletheia}
      POSTGRES_DB: ${POSTGRES_DB:-aletheia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The backend runs Alembic at startup, so it must not connect before
    # PostgreSQL accepts connections.
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-aletheia} -d ${POSTGRES_DB:-aletheia}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aletheia}:${POSTGRES_PASSWORD:-aletheia}@db:5432/${POSTGRES_DB:-aletheia}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      # Local Ollama (Windows host owns the model; no key needed).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      # Internal ML service (OCR + embeddings) on the Compose network.
      ML_SERVICE_URL: http://ml:8001
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_PROVIDER: ${OCR_PROVIDER:-paddleocr}
      OCR_LANGUAGE: ${OCR_LANGUAGE:-en}
      OCR_ALLOW_MODEL_DOWNLOAD: ${OCR_ALLOW_MODEL_DOWNLOAD:-false}
      # The web client calls this API from the browser.
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    # Lets host.docker.internal resolve on Linux Docker too (no-op on
    # Docker Desktop, where it already resolves to the host).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Internal ML runtime (PaddleOCR + MiniLM). Backend calls it over the
  # Compose network; it is NOT published publicly and the frontend never
  # talks to it. LLM inference stays on the Windows host (not in this image).
  ml:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    environment:
      OCR_LANGUAGE: ${OCR_LANGUAGE:-en}
      OCR_ALLOW_MODEL_DOWNLOAD: ${OCR_ALLOW_MODEL_DOWNLOAD:-false}
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    expose:
      - "8001"

  # Next.js workspace: the review UI. The browser calls the backend
  # directly, so nothing proxies through this container.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the client bundle: the browser calls the published
        # host port directly, not the compose network name.
        NEXT_PUBLIC_ALETHEIA_API_URL: ${NEXT_PUBLIC_ALETHEIA_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
